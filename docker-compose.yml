services:
  postgres:
    image: postgres:15-alpine
    container_name: primentoring-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: primentoring
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - primentoring-network
    restart: always

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: primentoring-api
    environment:
      DATABASE_URL: postgresql://postgres:password@postgres:5432/primentoring
      PORT: 3000
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - primentoring-network
    restart: always
    volumes:
      - seed_flag:/app
    stdin_open: true
    tty: true

volumes:
  postgres_data:
  seed_flag:

networks:
  primentoring-network:
    driver: bridge
